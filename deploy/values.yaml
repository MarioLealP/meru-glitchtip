# glitchtip's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: glitchtip
owner: mario
image:
  repository: zot.clockmost.com/meru/glitchtip
  digest: sha256:b88013c8e5327fc1d49bd432516746e2eedb9d3cf6dcf739ec9da24be65f74be
  tag: "e120e6e3e1bc"

# Secrets from the request (D99): Janus wrote the values to OpenBao apps/meru/<app>/eso/env when the app was requested.
# GlitchTip runs all-in-one: web, its background worker and its migrations in one container, with Postgres as cache and
# queue (no Valkey). Tested 2026-11-05 under these rules: about 195 MB, migrations about 20s on an empty database.
port: 8000
heartbeat:
  path: /_health/
  scheme: HTTPS
  host: glitchtip.clockmost.com # ALLOWED_HOSTS refuses the pod's IP, which is what the probes would otherwise send
  startupFailureThreshold: 90 # 3 minutes: the first start migrates an empty database
# TLS in the pod, from Meru's CA (like Warpgate): Django only builds https:// addresses - the OIDC return address
# Authentik checks - when its own connection is TLS; it has no setting to trust Caddy's X-Forwarded-Proto. granian reads
# keys in PKCS#8 only. A renewal (every 16h) restarts the pod (Kyverno restart-on-secret-change): about 20-30s down.
certificate:
  enabled: true
  keyEncoding: PKCS8
env:
  SERVER_ROLE: all_in_one # the default (web) skips the migrations and the worker
  GRANIAN_SSL_CERTIFICATE: /var/run/meru/tls/tls.crt
  GRANIAN_SSL_KEYFILE: /var/run/meru/tls/tls.key
  GLITCHTIP_DOMAIN: https://glitchtip.clockmost.com
  ALLOWED_HOSTS: glitchtip.clockmost.com
  CSRF_TRUSTED_ORIGINS: https://glitchtip.clockmost.com
  VALKEY_URL: "" # empty = Postgres for cache, sessions and the task queue
  MEDIA_ROOT: /code/uploads/ # default is the read-only working directory
  # The login comes in pieces (D121), never inside a URL; this URL carries only the TLS requirement.
  DATABASE_URL: postgres://glitchtip-db-rw.glitchtip.svc:5432/glitchtip?sslmode=require
  DATABASE_HOST: glitchtip-db-rw.glitchtip.svc
  DATABASE_NAME: glitchtip
  # Sign-in is Authentik only (D120): no sign-up with a password, but an Authentik login makes its account. GlitchTip
  # leaves sign-up open while it has no users at all, so the route stays off until Mario's admin exists.
  ENABLE_USER_REGISTRATION: "false"
  ENABLE_SOCIAL_APPS_USER_REGISTRATION: "true"
  ENABLE_ORGANIZATION_CREATION: "false"
  GRANIAN_WORKERS: "1"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi
persistence:
  - name: uploads # source maps and attachments
    mountPath: /code/uploads
    size: 5Gi
    storageClass: local
networkPolicy:
  enabled: true # Caddy (the host side) gets in; other apps' pods don't until they report errors here

externalSecrets:
  env: {}
secretEnv:
  SECRET_KEY:
    secret: env
    key: secret-key
  # The database owner's login, made by CNPG (D121: GlitchTip migrates and makes partitions as it runs).
  DATABASE_USER:
    secret: glitchtip-db-app
    key: username
  DATABASE_PASSWORD:
    secret: glitchtip-db-app
    key: password
